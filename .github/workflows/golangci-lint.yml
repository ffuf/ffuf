name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:
permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # checkout must precede setup-go: setup-go v4+ caches by default and
      # resolves go.sum from the working tree.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v1 ended at v1.64.8, which is built with go1.24 and refuses a
          # module targeting go1.25. v2 is the only line that can lint this
          # module. Linter set and exclusions are held at the v1 defaults in
          # .golangci.yml so this is a toolchain bump, not a policy change.
          version: v2.13.2
