name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # checkout must precede setup-go: setup-go v4+ caches by default and
      # resolves go.sum from the working tree.
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v1 ended at v1.64.8, which is built with go1.24 and refuses a
          # module targeting go1.25. v2 is the only line that can lint this
          # module. Linter set and exclusions are held at the v1 defaults in
          # .golangci.yml so this is a toolchain bump, not a policy change.
          version: v2.13.2
