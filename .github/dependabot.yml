version: 2

updates:
  # Go modules. Without this block Dependabot only opens PRs for published
  # security advisories, which is why golang.org/x/net sat at v0.7.0 from
  # early 2023 until one was filed against it.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  # Action versions, including the commit SHAs the workflows pin. Dependabot
  # rewrites a pinned SHA and its trailing version comment together, so the
  # pins do not go stale.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
