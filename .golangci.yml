version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

issues:
  # Report every finding. All three of these suppress by default, and the
  # effect compounds silently -- before the tree was cleaned, the default
  # output said 32 when the real count was 87. A gate that prints a
  # truncated number gives no sign it truncated, so it reads as the total.
  max-issues-per-linter: 0   # default 50
  max-same-issues: 0         # default 3
  uniq-by-line: false        # default true -- hides extra issues on one line
